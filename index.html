<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="multimedia/logoULADpng.png">
    <meta http-equiv="refresh" content="5;url=homepage.html">
    <title>Ultra Astra Dreamers [ULAD] — Inizializzazione Sistemi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        inaraBg: '#111317',
                        inaraPanel: '#191c22',
                        inaraBorder: '#2c313d',
                        inaraText: '#d1d5db',
                        inaraMuted: '#8b92a2',
                        uladOrange: '#ff6600',
                        uladOrangeDim: 'rgba(255, 102, 0, 0.15)',
                        uladAmber: '#ff944d'
                    },
                    fontFamily: {
                        hud: ['Orbitron', 'sans-serif'],
                        body: ['Rajdhani', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #111317;
            color: #d1d5db;
            font-family: 'Rajdhani', sans-serif;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 102, 0, 0.06) 0%, transparent 55%),
                linear-gradient(to bottom, #111317, #0d0f12);
        }

        .grid-overlay {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        .tactical-panel {
            background-color: #191c22;
            border: 1px solid #2c313d;
            position: relative;
        }
        .tactical-panel::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 12px;
            height: 12px;
            border-top: 2px solid #ff6600;
            border-left: 2px solid #ff6600;
        }
        .tactical-panel::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 12px;
            height: 12px;
            border-bottom: 2px solid #ff6600;
            border-right: 2px solid #ff6600;
        }

        /* Anelli rotanti stile radar / FSD charging */
        @keyframes spin-cw {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes spin-ccw {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
        .ring-outer {
            animation: spin-cw 6s linear infinite;
        }
        .ring-inner {
            animation: spin-ccw 3.5s linear infinite;
        }

        .orange-glow {
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 grid-overlay antialiased selection:bg-uladOrange selection:text-white">

    <main class="tactical-panel max-w-lg w-full p-8 sm:p-10 rounded text-center space-y-7 shadow-2xl">
        
        <!-- Intestazione HUD -->
        <div class="flex items-center justify-between text-[11px] font-mono text-inaraMuted border-b border-inaraBorder pb-3">
            <span class="flex items-center gap-2 text-uladOrange">
                <span class="w-2 h-2 rounded-full bg-uladOrange animate-ping"></span>
                ULAD // BOOT SEQUENCE
            </span>
            <span>ID: 12623</span>
        </div>

        <!-- Loader Radar / FSD Dinamico -->
        <div class="relative w-32 h-32 mx-auto flex items-center justify-center">
            <!-- Anello esterno tratteggiato -->
            <div class="ring-outer absolute inset-0 rounded-full border-2 border-dashed border-uladOrange/50"></div>
            <!-- Anello intermedio con archi -->
            <div class="ring-inner absolute inset-3 rounded-full border-2 border-transparent border-t-uladOrange border-b-uladAmber"></div>
            <!-- Nucleo centrale -->
            <div class="relative w-16 h-16 rounded-full bg-inaraBg border border-uladOrange/70 flex items-center justify-center orange-glow">
                <span class="font-hud font-black text-sm text-white tracking-wider">ULAD</span>
            </div>
        </div>

        <!-- Titolo & Stato Telemetria -->
        <div class="space-y-2">
            <h1 class="font-hud text-xl sm:text-2xl font-bold text-white tracking-wider">
                ULTRA ASTRA DREAMERS
            </h1>
            <p id="status-text" class="font-mono text-xs text-uladOrange uppercase tracking-widest">
                Inizializzazione interfaccia di comando...
            </p>
        </div>

        <!-- Barra di avanzamento 5 secondi -->
        <div class="space-y-2.5 text-left">
            <div class="flex justify-between items-center text-xs font-mono">
                <span class="text-inaraMuted">CARICAMENTO PORTALE</span>
                <span id="progress-percent" class="text-white font-bold">0%</span>
            </div>
            <div class="w-full h-2 bg-inaraBg rounded overflow-hidden border border-inaraBorder p-[1px]">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-uladOrange to-uladAmber rounded-sm transition-all duration-75" style="width: 0%;"></div>
            </div>
            <div class="flex justify-between items-center text-[11px] font-mono text-inaraMuted pt-1">
                <span>DESTINAZIONE: <span class="text-inaraText">homepage.html</span></span>
                <span id="countdown-text">5.0s</span>
            </div>
        </div>

        <!-- Link diretto di sicurezza -->
        <div class="pt-2 border-t border-inaraBorder/70">
            <a href="homepage.html" class="inline-flex items-center gap-2 text-xs font-hud text-inaraMuted hover:text-uladOrange transition tracking-wider uppercase">
                Salta caricamento &rarr;
            </a>
        </div>

    </main>

    <script>
        const targetUrl = 'homepage.html';
        const duration = 5000; // 5 secondi
        const startTime = performance.now();

        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        const countdownText = document.getElementById('countdown-text');
        const statusText = document.getElementById('status-text');

        const statusMessages = [
            { at: 0, text: 'Inizializzazione interfaccia di comando...' },
            { at: 25, text: 'Sincronizzazione telemetria Ultra Astra Corp...' },
            { at: 55, text: 'Verifica coordinate settore [ULAD]...' },
            { at: 85, text: 'Frameshift Drive pronto — Ingaggio...' }
        ];

        function updateLoader(now) {
            const elapsed = now - startTime;
            const progress = Math.min((elapsed / duration) * 100, 100);
            const remaining = Math.max((duration - elapsed) / 1000, 0);

            progressBar.style.width = progress.toFixed(1) + '%';
            progressPercent.textContent = Math.floor(progress) + '%';
            countdownText.textContent = remaining.toFixed(1) + 's';

            for (let i = statusMessages.length - 1; i >= 0; i--) {
                if (progress >= statusMessages[i].at) {
                    statusText.textContent = statusMessages[i].text;
                    break;
                }
            }

            if (elapsed < duration) {
                requestAnimationFrame(updateLoader);
            } else {
                window.location.href = targetUrl;
            }
        }

        requestAnimationFrame(updateLoader);
    </script>
</body>
</html>
