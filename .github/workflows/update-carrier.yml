name: Update Squadron Carrier

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find system reference in Spansh station record
        run: |
          python3 - <<'EOF'
          import json
          import urllib.request

          url = "https://spansh.co.uk/api/station/3715273472"
          req = urllib.request.Request(url, headers={"User-Agent": "ULAD-Site-Updater/1.0"})
          with urllib.request.urlopen(req, timeout=20) as resp:
              payload = json.loads(resp.read().decode("utf-8"))

          record = payload.get("record", {})
          if isinstance(record, dict):
              for k, v in record.items():
                  if str(v) == "5070074946961" or "system" in k.lower() or "id64" in k.lower() or "address" in k.lower():
                      print(f"{k}: {repr(v)}")
          EOF
