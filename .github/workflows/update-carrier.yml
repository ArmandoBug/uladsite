name: Update Squadron Carrier

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Spansh station data and update carrier.json
        run: |
          python3 - <<'EOF'
          import json
          import urllib.request
          from datetime import datetime, timezone

          url = "https://spansh.co.uk/api/station/3715273472"
          req = urllib.request.Request(url, headers={"User-Agent": "ULAD-Site-Updater/1.0"})
          with urllib.request.urlopen(req, timeout=20) as resp:
              payload = json.loads(resp.read().decode("utf-8"))

          record = payload.get("record", payload)
          system_name = record.get("system_name") or ""
          system_id64 = record.get("system_id64")
          carrier_name = record.get("name") or "Ulad-01 Nostromo"

          out_path = "carrier.json"
          try:
              with open(out_path, "r", encoding="utf-8") as f:
                  current = json.load(f)
          except Exception:
              current = {}

          if system_name and current.get("system") != system_name:
              updated = {
                  "name": carrier_name,
                  "callsign": "ULAD",
                  "system": system_name,
                  "system_id64": system_id64,
                  "updated_at": datetime.now(timezone.utc).isoformat()
              }
              with open(out_path, "w", encoding="utf-8") as f:
                  json.dump(updated, f, indent=2, ensure_ascii=False)
                  f.write("\n")
          EOF

      - name: Commit changes if carrier.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carrier.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update Squadron Carrier system"
            git push
          fi
