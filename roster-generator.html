<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>ULAD // Generatore Roster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>const cmdrInput = document.getElementById('cmdr-input');
        const rankInput = document.getElementById('rank-input');
        const dutiesInput = document.getElementById('duties-input');
        const inaraUrlInput = document.getElementById('inara-url-input');

        const ghOwnerInput = document.getElementById('gh-owner');
        const ghRepoInput = document.getElementById('gh-repo');
        const ghBranchInput = document.getElementById('gh-branch');
        const ghTokenInput = document.getElementById('gh-token');

        const publishBtn = document.getElementById('publish-roster-btn');
        const publishIcon = document.getElementById('publish-icon');
        const publishLabel = document.getElementById('publish-label');
        const publishStatus = document.getElementById('publish-status');

        const loadRosterBtn = document.getElementById('load-roster-btn');
        const loadRosterIcon = document.getElementById('load-roster-icon');
        const deleteCmdrSelect = document.getElementById('delete-cmdr-select');
        const deleteCmdrBtn = document.getElementById('delete-cmdr-btn');
        const deleteIcon = document.getElementById('delete-icon');
        const deleteLabel = document.getElementById('delete-label');
        const deleteStatus = document.getElementById('delete-status');

        const generatedCodeEl = document.getElementById('generated-code');
        const copyCodeBtn = document.getElementById('copy-code-btn');
        const copyIcon = document.getElementById('copy-icon');
        const copyLabel = document.getElementById('copy-label');
        const resetFormBtn = document.getElementById('reset-roster-form-btn');

        const previewRank = document.getElementById('preview-rank');
        const previewCmdr = document.getElementById('preview-cmdr');
        const previewDuties = document.getElementById('preview-duties');
        const previewInara = document.getElementById('preview-inara');

        function escapeJs(str) {
            return String(str ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\r?\n/g, ' ');
        }

        function formatCmdrName(raw) {
            const cleaned = String(raw || '').trim();
            if (!cleaned) return 'CMDR';
            return /^cmdr\s+/i.test(cleaned) ? cleaned : `CMDR ${cleaned}`;
        }

        function buildMemberObjectCode() {
            const cmdrVal = formatCmdrName(cmdrInput.value);
            const rankVal = rankInput.value.trim() || 'Membro';
            const dutiesVal = dutiesInput.value.trim() || 'Servizio di squadrone';
            const inaraVal = inaraUrlInput.value.trim();

            return `{
                cmdr: '${escapeJs(cmdrVal)}',
                rank: '${escapeJs(rankVal)}',
                duties: '${escapeJs(dutiesVal)}',
                inaraUrl: '${escapeJs(inaraVal)}'
            }`;
        }

        function updatePreviewAndCode() {
            const cmdrVal = formatCmdrName(cmdrInput.value);
            const rankVal = rankInput.value.trim() || 'Membro';
            const dutiesVal = dutiesInput.value.trim() || 'Servizio di squadrone';
            const hasInara = /^https?:\/\//i.test(inaraUrlInput.value.trim());

            generatedCodeEl.textContent = `${buildMemberObjectCode()},`;
            previewCmdr.textContent = cmdrVal;
            previewRank.textContent = rankVal.toUpperCase();
            previewDuties.textContent = dutiesVal;
            previewInara.textContent = hasInara ? 'Profilo INARA ↗' : 'Link INARA non impostato';
            previewInara.className = hasInara
                ? 'text-uladOrange font-hud font-bold uppercase tracking-wider'
                : 'text-inaraMuted';
        }

        function setBoxStatus(el, type, msg) {
            el.classList.remove('hidden', 'border-emerald-500/50', 'bg-emerald-950/40', 'text-emerald-300', 'border-red-500/50', 'bg-red-950/40', 'text-red-300', 'border-uladOrange/50', 'bg-uladOrangeDim', 'text-uladAmber');
            if (type === 'success') {
                el.classList.add('border-emerald-500/50', 'bg-emerald-950/40', 'text-emerald-300');
            } else if (type === 'error') {
                el.classList.add('border-red-500/50', 'bg-red-950/40', 'text-red-300');
            } else {
                el.classList.add('border-uladOrange/50', 'bg-uladOrangeDim', 'text-uladAmber');
            }
            el.textContent = msg;
        }

        function utf8ToBase64(str) {
            const bytes = new TextEncoder().encode(str);
            let bin = '';
            const chunk = 0x8000;
            for (let i = 0; i < bytes.length; i += chunk) {
                bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
            }
            return btoa(bin);
        }

        function base64ToUtf8(b64) {
            const clean = b64.replace(/\s+/g, '');
            const bin = atob(clean);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder().decode(bytes);
        }

        async function getFileMeta(owner, repo, path, branch, token) {
            const enc = path.split('/').map(encodeURIComponent).join('/');
            const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${enc}?ref=${encodeURIComponent(branch)}`;
            const res = await fetch(url, {
                headers: {
                    'Accept': 'application/vnd.github+json',
                    'Authorization': `Bearer ${token}`,
                    'X-GitHub-Api-Version': '2022-11-28'
                }
            });
            if (res.status === 404) return null;
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.message || `Errore lettura ${path} (${res.status})`);
            return data;
        }

        async function ghPutFile(owner, repo, path, branch, token, payload) {
            const enc = path.split('/').map(encodeURIComponent).join('/');
            const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${enc}`;
            const res = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Accept': 'application/vnd.github+json',
                    'Authorization': `Bearer ${token}`,
                    'X-GitHub-Api-Version': '2022-11-28'
                },
                body: JSON.stringify({ ...payload, branch })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.message || `Errore scrittura ${path} (${res.status})`);
            return data;
        }

        function insertIntoRosterArray(htmlText, itemCode) {
            const re = /(const\s+squadronRoster\s*=\s*\[)([\s\S]*?)(\n\s*\];)/;
            const m = htmlText.match(re);
            if (!m) throw new Error('Array "squadronRoster" non trovato in roster.html.');

            const prefix = m[1];
            const body = m[2];
            const suffix = m[3];
            const trimmed = body.trimEnd();
            const hasItems = trimmed.trim().length > 0;
            const withComma = hasItems && !trimmed.endsWith(',') ? `${trimmed},` : trimmed;
            const newBody = hasItems ? `${withComma}\n            ${itemCode}` : `\n            ${itemCode}`;

            return htmlText.replace(m[0], `${prefix}${newBody}${suffix}`);
        }

        function findRosterSpan(htmlText) {
            const re = /const\s+squadronRoster\s*=\s*\[/;
            const m = htmlText.match(re);
            if (!m) throw new Error('Array "squadronRoster" non trovato in roster.html.');
            const openIdx = m.index + m[0].length - 1;
            let depth = 0, inS = false, inD = false, inT = false, esc = false;
            for (let i = openIdx; i < htmlText.length; i++) {
                const ch = htmlText[i];
                if (esc) { esc = false; continue; }
                if (ch === '\\') { esc = true; continue; }
                if (!inD && !inT && ch === "'") { inS = !inS; continue; }
                if (!inS && !inT && ch === '"') { inD = !inD; continue; }
                if (!inS && !inD && ch === '`') { inT = !inT; continue; }
                if (inS || inD || inT) continue;
                if (ch === '[') depth++;
                else if (ch === ']') {
                    depth--;
                    if (depth === 0) return { start: openIdx + 1, end: i };
                }
            }
            throw new Error('Chiusura "]" non trovata per "squadronRoster".');
        }

        function parseObjects(body) {
            const out = [];
            let i = 0;
            while (i < body.length) {
                if (body[i] === '{') {
                    const start = i;
                    let depth = 0, inS = false, inD = false, inT = false, esc = false;
                    for (; i < body.length; i++) {
                        const ch = body[i];
                        if (esc) { esc = false; continue; }
                        if (ch === '\\') { esc = true; continue; }
                        if (!inD && !inT && ch === "'") { inS = !inS; continue; }
                        if (!inS && !inT && ch === '"') { inD = !inD; continue; }
                        if (!inS && !inD && ch === '`') { inT = !inT; continue; }
                        if (inS || inD || inT) continue;
                        if (ch === '{') depth++;
                        else if (ch === '}') {
                            depth--;
                            if (depth === 0) {
                                const raw = body.slice(start, i + 1);
                                const cmdrM = raw.match(/cmdr\s*:\s*(['"`])(.*?)\1/);
                                const rankM = raw.match(/rank\s*:\s*(['"`])(.*?)\1/);
                                out.push({
                                    start,
                                    end: i + 1,
                                    cmdr: cmdrM ? cmdrM[2] : `CMDR #${out.length + 1}`,
                                    rank: rankM ? rankM[2] : ''
                                });
                                i++;
                                break;
                            }
                        }
                    }
                } else {
                    i++;
                }
            }
            return out;
        }

        async function refreshDeleteDropdown(owner, repo, branch, token) {
            const fileMeta = await getFileMeta(owner, repo, 'roster.html', branch, token);
            if (!fileMeta || !fileMeta.content) throw new Error('File roster.html non trovato.');
            const html = base64ToUtf8(fileMeta.content);
            const span = findRosterSpan(html);
            const body = html.slice(span.start, span.end);
            const items = parseObjects(body);

            deleteCmdrSelect.innerHTML = '';
            if (!items.length) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '-- Nessun profilo CMDR presente --';
                deleteCmdrSelect.appendChild(opt);
                return 0;
            }

            items.forEach((entry, idx) => {
                const opt = document.createElement('option');
                opt.value = String(idx);
                opt.textContent = `${formatCmdrName(entry.cmdr)}${entry.rank ? ` — ${entry.rank}` : ''}`;
                deleteCmdrSelect.appendChild(opt);
            });
            return items.length;
        }

        publishBtn.addEventListener('click', async () => {
            const owner = ghOwnerInput.value.trim();
            const repo = ghRepoInput.value.trim();
            const branch = ghBranchInput.value.trim() || 'main';
            const token = ghTokenInput.value.trim();
            const cmdrName = formatCmdrName(cmdrInput.value);

            if (!token) {
                setBoxStatus(publishStatus, 'error', 'Inserisci un GitHub Personal Access Token con permesso Contents: Read and write.');
                return;
            }

            publishBtn.disabled = true;
            publishIcon.className = 'fa-solid fa-spinner fa-spin';
            publishLabel.textContent = 'CARICAMENTO IN CORSO...';
            setBoxStatus(publishStatus, 'info', 'Caricamento profilo in squadronRoster (roster.html)...');

            try {
                const fileMeta = await getFileMeta(owner, repo, 'roster.html', branch, token);
                if (!fileMeta || !fileMeta.content || !fileMeta.sha) {
                    throw new Error('Impossibile leggere roster.html dal repository.');
                }

                const currentHtml = base64ToUtf8(fileMeta.content);
                const updatedHtml = insertIntoRosterArray(currentHtml, buildMemberObjectCode());

                await ghPutFile(owner, repo, 'roster.html', branch, token, {
                    message: `feat(roster): add ${cmdrName}`,
                    content: utf8ToBase64(updatedHtml),
                    sha: fileMeta.sha
                });

                await refreshDeleteDropdown(owner, repo, branch, token);
                setBoxStatus(publishStatus, 'success', `Profilo caricato in roster.html per ${cmdrName}.`);
            } catch (err) {
                setBoxStatus(publishStatus, 'error', `Errore:\n${err.message}`);
            } finally {
                publishBtn.disabled = false;
                publishIcon.className = 'fa-solid fa-cloud-arrow-up';
                publishLabel.textContent = 'CARICA PROFILO IN ROSTER.HTML';
            }
        });

        loadRosterBtn.addEventListener('click', async () => {
            const owner = ghOwnerInput.value.trim();
            const repo = ghRepoInput.value.trim();
            const branch = ghBranchInput.value.trim() || 'main';
            const token = ghTokenInput.value.trim();

            if (!token) {
                setBoxStatus(deleteStatus, 'error', 'Inserisci prima il GitHub Personal Access Token.');
                return;
            }

            loadRosterBtn.disabled = true;
            loadRosterIcon.className = 'fa-solid fa-spinner fa-spin';
            setBoxStatus(deleteStatus, 'info', 'Lettura profili CMDR da roster.html...');

            try {
                const count = await refreshDeleteDropdown(owner, repo, branch, token);
                if (!count) {
                    setBoxStatus(deleteStatus, 'info', 'Nessun profilo CMDR presente in roster.html.');
                } else {
                    setBoxStatus(deleteStatus, 'success', `Caricati ${count} profili CMDR da roster.html.`);
                }
            } catch (err) {
                setBoxStatus(deleteStatus, 'error', `Errore lettura:\n${err.message}`);
            } finally {
                loadRosterBtn.disabled = false;
                loadRosterIcon.className = 'fa-solid fa-rotate';
            }
        });

        deleteCmdrBtn.addEventListener('click', async () => {
            const owner = ghOwnerInput.value.trim();
            const repo = ghRepoInput.value.trim();
            const branch = ghBranchInput.value.trim() || 'main';
            const token = ghTokenInput.value.trim();
            const targetIdx = Number(deleteCmdrSelect.value);

            if (!token) {
                setBoxStatus(deleteStatus, 'error', 'Inserisci il GitHub Personal Access Token.');
                return;
            }
            if (deleteCmdrSelect.value === '' || Number.isNaN(targetIdx)) {
                setBoxStatus(deleteStatus, 'error', 'Clicca prima "Carica profili" e seleziona un profilo CMDR.');
                return;
            }

            deleteCmdrBtn.disabled = true;
            deleteIcon.className = 'fa-solid fa-spinner fa-spin';
            deleteLabel.textContent = 'ELIMINAZIONE IN CORSO...';

            try {
                const fileMeta = await getFileMeta(owner, repo, 'roster.html', branch, token);
                if (!fileMeta || !fileMeta.content || !fileMeta.sha) {
                    throw new Error('Impossibile leggere roster.html.');
                }

                const html = base64ToUtf8(fileMeta.content);
                const span = findRosterSpan(html);
                const body = html.slice(span.start, span.end);
                const items = parseObjects(body);
                const chosen = items[targetIdx];
                if (!chosen) throw new Error('Profilo CMDR selezionato non trovato.');

                let remStart = chosen.start;
                let remEnd = chosen.end;
                let after = remEnd;
                while (after < body.length && /\s/.test(body[after])) after++;
                if (after < body.length && body[after] === ',') {
                    remEnd = after + 1;
                    if (body[remEnd] === '\r') remEnd++;
                    if (body[remEnd] === '\n') remEnd++;
                } else {
                    let before = remStart - 1;
                    while (before >= 0 && /\s/.test(body[before])) before--;
                    if (before >= 0 && body[before] === ',') remStart = before;
                }

                const newBody = body.slice(0, remStart) + body.slice(remEnd);
                const updatedHtml = html.slice(0, span.start) + newBody + html.slice(span.end);

                await ghPutFile(owner, repo, 'roster.html', branch, token, {
                    message: `chore(roster): remove ${formatCmdrName(chosen.cmdr)}`,
                    content: utf8ToBase64(updatedHtml),
                    sha: fileMeta.sha
                });

                await refreshDeleteDropdown(owner, repo, branch, token);
                setBoxStatus(deleteStatus, 'success', `Eliminato il profilo di ${formatCmdrName(chosen.cmdr)} da roster.html.`);
            } catch (err) {
                setBoxStatus(deleteStatus, 'error', `Errore eliminazione:\n${err.message}`);
            } finally {
                deleteCmdrBtn.disabled = false;
                deleteIcon.className = 'fa-solid fa-trash';
                deleteLabel.textContent = 'ELIMINA PROFILO SELEZIONATO';
            }
        });

        [cmdrInput, rankInput, dutiesInput, inaraUrlInput].forEach(el => {
            el.addEventListener('input', updatePreviewAndCode);
        });

        copyCodeBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(generatedCodeEl.textContent);
            } catch (_) {
                const ta = document.createElement('textarea');
                ta.value = generatedCodeEl.textContent;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            copyIcon.className = 'fa-solid fa-check';
            copyLabel.textContent = 'COPIATO!';
            setTimeout(() => {
                copyIcon.className = 'fa-regular fa-copy';
                copyLabel.textContent = 'COPIA CODICE';
            }, 1800);
        });

        resetFormBtn.addEventListener('click', () => {
            cmdrInput.value = 'CMDR ArmandoBug';
            rankInput.value = 'Senior Officer';
            dutiesInput.value = 'Comunicazioni, operazioni e supporto squadrone';
            inaraUrlInput.value = 'https://inara.cz/elite/cmdr/517668/';
            publishStatus.classList.add('hidden');
            deleteStatus.classList.add('hidden');
            updatePreviewAndCode();
        });

        updatePreviewAndCode();
    </script>
</body>
</html>
