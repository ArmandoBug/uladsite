<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="multimedia/logoULADpng.png">
    <title>ULAD Command — Gestione Account Membri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        inaraBg: '#111317',
                        inaraPanel: '#191c22',
                        inaraPanelHover: '#20242c',
                        inaraBorder: '#2c313d',
                        inaraText: '#d1d5db',
                        inaraMuted: '#8b92a2',
                        uladOrange: '#ff6600',
                        uladOrangeDim: 'rgba(255, 102, 0, 0.15)',
                        uladAmber: '#ff944d'
                    },
                    fontFamily: {
                        hud: ['Orbitron', 'sans-serif'],
                        body: ['Rajdhani', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #111317;
            color: #d1d5db;
            font-family: 'Rajdhani', sans-serif;
        }
        .tactical-card {
            background-color: #191c22;
            border: 1px solid #2c313d;
            position: relative;
        }
        .tactical-corner::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px;
            width: 10px; height: 10px;
            border-top: 2px solid #ff6600;
            border-left: 2px solid #ff6600;
        }
        .tactical-corner::after {
            content: '';
            position: absolute;
            bottom: -1px; right: -1px;
            width: 10px; height: 10px;
            border-bottom: 2px solid #ff6600;
            border-right: 2px solid #ff6600;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <header class="bg-inaraBg/95 border-b border-inaraBorder">
        <div class="max-w-5xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="multimedia/logoULADpng.png" alt="ULAD" class="w-10 h-10 rounded-full border border-uladOrange/60">
                <div>
                    <div class="font-hud font-bold text-white text-base">ULTRA ASTRA DREAMERS [ULAD]</div>
                    <div class="font-mono text-xs text-uladOrange">ADMIN CONSOLE // CREAZIONE ACCOUNT MEMBRI</div>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="deck.html" class="px-3.5 py-2 rounded bg-inaraPanel border border-inaraBorder hover:border-uladOrange text-xs font-hud text-white transition">
                    IL MIO DECK
                </a>
                <a href="homepage.html" class="px-3.5 py-2 rounded bg-uladOrange text-inaraBg font-hud font-bold text-xs transition">
                    HOME
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-5xl w-full mx-auto px-4 py-12 space-y-10 flex-grow">
        
        <div id="admin-guard-msg" class="tactical-card tactical-corner p-6 rounded text-center font-mono text-sm text-inaraMuted">
            Verifica privilegi di Comando [ULAD]...
        </div>

        <div id="admin-content" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-5 tactical-card tactical-corner p-6 rounded space-y-5 h-fit">
                <div class="border-b border-inaraBorder pb-3">
                    <span class="font-mono text-xs text-uladOrange uppercase">Nuovo Arruolamento</span>
                    <h2 class="font-hud text-lg font-bold text-white">CREA ACCOUNT MEMBRO ULAD</h2>
                </div>

                <form id="create-member-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-mono text-inaraMuted uppercase mb-1">Nome Utente (CMDR)</label>
                        <input id="member-username" type="text" required minlength="3" placeholder="Es. CMDR_Marco" class="w-full px-3.5 py-2.5 rounded bg-inaraBg border border-inaraBorder focus:border-uladOrange focus:outline-none text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-mono text-inaraMuted uppercase mb-1">Password Iniziale</label>
                        <input id="member-password" type="text" required minlength="6" placeholder="Minimo 6 caratteri" class="w-full px-3.5 py-2.5 rounded bg-inaraBg border border-inaraBorder focus:border-uladOrange focus:outline-none text-sm text-white font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-mono text-inaraMuted uppercase mb-1">Ruolo Squadrone</label>
                        <select id="member-role" class="w-full px-3.5 py-2.5 rounded bg-inaraBg border border-inaraBorder focus:border-uladOrange focus:outline-none text-xs font-mono text-white">
                            <option value="member">MEMBRO STANDARD</option>
                            <option value="admin">COMANDO / ADMIN</option>
                        </select>
                    </div>

                    <div id="create-feedback" class="hidden text-xs font-mono p-3 rounded border"></div>

                    <button type="submit" id="create-member-btn" class="w-full py-3 rounded bg-uladOrange hover:bg-uladAmber text-inaraBg font-hud font-bold text-xs tracking-wider transition">
                        <i class="fa-solid fa-user-plus mr-1.5"></i> GENERA ACCOUNT & DECK
                    </button>
                </form>
            </div>

            <div class="lg:col-span-7 tactical-card tactical-corner p-6 rounded space-y-5">
                <div class="flex items-center justify-between border-b border-inaraBorder pb-3">
                    <div>
                        <span class="font-mono text-xs text-uladOrange uppercase">Database Piloti</span>
                        <h2 class="font-hud text-lg font-bold text-white">ACCOUNT ATTIVI [ULAD]</h2>
                    </div>
                    <span id="members-count" class="font-mono text-xs text-uladOrange">0 PILOTI</span>
                </div>

                <div id="members-list" class="space-y-2.5"></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        
// ============================================================================
// CONFIGURAZIONE FIREBASE [ULAD]
// Incolla qui sotto i dati della tua Web App dalla Firebase Console.
// ============================================================================
const firebaseConfig = {
  apiKey: "AIzaSyAeS6i7vUA13FHnQxJCsNnL2NL4RzbXZeQ",
  authDomain: "ulad-de921.firebaseapp.com",
  projectId: "ulad-de921",
  storageBucket: "ulad-de921.firebasestorage.app",
  messagingSenderId: "780852375378",
  appId: "1:780852375378:web:e2580b8a61b97a260b548b"
};

const ULAD_AUTH_DOMAIN = "ulad.local";

function usernameToAuthEmail(username) {
    const clean = String(username || "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9._-]/g, "");
    return `${clean}@${ULAD_AUTH_DOMAIN}`;
}


        const primaryApp = initializeApp(FIREBASE_CONFIG);
        const primaryAuth = getAuth(primaryApp);
        const db = getFirestore(primaryApp);

        const secondaryApp = initializeApp(FIREBASE_CONFIG, "SecondaryUserCreator");
        const secondaryAuth = getAuth(secondaryApp);

        const guardMsg = document.getElementById('admin-guard-msg');
        const adminContent = document.getElementById('admin-content');

        onAuthStateChanged(primaryAuth, async (user) => {
            if (!user) {
                guardMsg.innerHTML = 'Accesso riservato al Comando ULAD. <a href="homepage.html" class="text-uladOrange underline">Effettua prima il login</a>.';
                return;
            }

            const snap = await getDoc(doc(db, 'ulad_members', user.uid));
            if (!snap.exists() || snap.data().role !== 'admin') {
                guardMsg.textContent = 'Permessi insufficienti: questo pannello è riservato agli amministratori ULAD.';
                return;
            }

            guardMsg.classList.add('hidden');
            adminContent.classList.remove('hidden');

            onSnapshot(collection(db, 'ulad_members'), (qSnap) => {
                const members = qSnap.docs.map(d => ({ uid: d.id, ...d.data() }));
                document.getElementById('members-count').textContent = `${members.length} PILOTI`;
                const listEl = document.getElementById('members-list');
                listEl.innerHTML = members.map(m => `
                    <div class="p-3.5 rounded bg-inaraBg border border-inaraBorder flex items-center justify-between gap-3">
                        <div>
                            <div class="font-hud text-sm font-bold text-white">CMDR ${String(m.username || 'N/D')}</div>
                            <div class="font-mono text-[11px] text-inaraMuted">UID: ${m.uid}</div>
                        </div>
                        <span class="font-mono text-[10px] px-2.5 py-1 rounded ${m.role === 'admin' ? 'bg-uladOrangeDim text-uladOrange border border-uladOrange/40' : 'bg-inaraPanel text-inaraText border border-inaraBorder'} uppercase">
                            ${m.role || 'member'}
                        </span>
                    </div>
                `).join('');
            });
        });

        document.getElementById('create-member-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('member-username').value.trim();
            const password = document.getElementById('member-password').value;
            const role = document.getElementById('member-role').value;
            const feedback = document.getElementById('create-feedback');
            const btn = document.getElementById('create-member-btn');

            feedback.classList.add('hidden');
            btn.disabled = true;

            try {
                const email = usernameToAuthEmail(username);
                const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
                await updateProfile(cred.user, { displayName: username });

                await setDoc(doc(db, 'ulad_members', cred.user.uid), {
                    username,
                    usernameSlug: username.toLowerCase().replace(/[^a-z0-9._-]/g, ''),
                    role,
                    createdAt: serverTimestamp()
                });

                await setDoc(doc(db, 'ulad_members', cred.user.uid, 'notes', 'welcome'), {
                    title: 'Benvenuto nel Command Deck [ULAD]',
                    type: 'PROMEMORIA',
                    system: 'Ultra Astra Corp',
                    due: '',
                    pinned: true,
                    dateLabel: new Date().toISOString().slice(0, 10),
                    content: 'Questo è il tuo spazio operativo personale. Puoi aggiungere task, note e modificare nome utente e password dal tasto ACCOUNT in alto.',
                    createdAtMs: Date.now(),
                    createdAt: serverTimestamp()
                });

                await signOut(secondaryAuth);

                feedback.textContent = `Account creato! Comunica al membro -> Username: "${username}" | Password: "${password}"`;
                feedback.className = 'text-xs font-mono p-3 rounded border border-emerald-500/50 bg-emerald-950/40 text-emerald-300';
                feedback.classList.remove('hidden');
                document.getElementById('create-member-form').reset();
            } catch (err) {
                feedback.textContent = 'Errore creazione account: ' + err.message;
                feedback.className = 'text-xs font-mono p-3 rounded border border-red-500/50 bg-red-950/40 text-red-300';
                feedback.classList.remove('hidden');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
